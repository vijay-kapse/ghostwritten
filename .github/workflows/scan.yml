name: scan

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Time budget in minutes"
        required: false
        default: "50"

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install "requests>=2.31"

      - name: Restore ETag cache
        uses: actions/cache@v4
        with:
          path: scanner/.cache
          key: etag-${{ github.run_id }}
          restore-keys: etag-

      - name: Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GH_SCAN_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scanner/run.py --minutes "${{ github.event.inputs.minutes || '50' }}"

      - name: Validate
        run: python scanner/validate.py

      - name: Commit data
        run: |
          git config user.name "ghostwritten-bot"
          git config user.email "bot@ghostwritten.dev"
          git add data/
          if git diff --cached --quiet; then
            echo "no data changes"
            exit 0
          fi
          git commit -m "data: nightly scan $(date -u +%Y-%m-%d) [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
